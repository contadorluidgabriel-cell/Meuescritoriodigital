name: Validate V11.1

on:
  push:
    branches:
      - main
      - migration/v11.1
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Restore original lockfile
        run: node scripts/restore-lockfile.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regression tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify legacy bundle
        run: test -s dist/legacy-v10-7.html

      - name: Comment generated source inspection
        if: github.event_name == 'pull_request' && hashFiles('inspection.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('inspection.md', 'utf8')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
